[project]
name = "acg-agent-platform"
version = "0.3.0"
description = "Synthetic enterprise agent control demonstrator"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi==0.141.1",
    "pydantic==2.13.5",
    "pydantic-settings>=2.10,<3",
    "uvicorn>=0.35,<1",
    "httpx2==2.13.1",
    "langgraph>=1.0,<2",
    "langgraph-checkpoint-sqlite>=3,<4",
]

[dependency-groups]
dev = ["pytest==9.1.1", "ruff>=0.12,<1", "mypy>=1.16,<3", "playwright>=1.50,<2"]

[build-system]
requires = ["uv_build>=0.11.7,<0.12"]
build-backend = "uv_build"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true
python_version = "3.11"
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
filterwarnings = ["error"]
